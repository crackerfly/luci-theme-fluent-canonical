<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Fluent">
  <title>Fluent</title>
  <!--
    Shapes carry a real fill="currentColor" so the file works in every consumer:
    inline or CSS mask (opaque alpha, repainted from the theme brand token),
    favicon and manifest, and PNG rasterisation. The stylesheet below only
    supplies the standalone colour. Do not move the fill back into the
    stylesheet alone: a mask would then have zero alpha and the mark vanishes.
  -->
  <style>
    svg { color: #024ad8; }
    @media (prefers-color-scheme: dark) { svg { color: #9058fc; } }
  </style>
  <g transform="translate(0,30)" fill="currentColor" fill-rule="evenodd">
    <polygon points="54 40 26.994 79.85 54 120 26.287 120 0 79.85 26.287 40"/>
    <polygon transform="matrix(-1,0,0,1,386,0)" points="220 40 192.99 79.85 220 120 192.29 120 166 79.85 192.29 40"/>
    <polygon points="60 80 112.53 0 140 0 87.488 80"/>
    <polygon points="80 160 132.53 80 160 80 107.49 160"/>
  </g>
</svg>
